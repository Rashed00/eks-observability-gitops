# Loki alert rules.
#
# These are LogQL rules in Loki's own file format (plain "groups:"), NOT a
# PrometheusRule resource - Prometheus cannot read LogQL. The ConfigMap is
# mounted by the Loki backend pod at /etc/loki/rules/fake (see
# charts/loki/values.yaml in the helm-charts repo), and Loki re-reads it
# about once a minute.
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-rules
  namespace: observability
data:
  log-alerts.yaml: |
    groups:
      - name: loki-error-alerts
        interval: 1m
        rules:
          - alert: HighLogErrorRate
            expr: |
              sum by (namespace) (rate({namespace=~".+"} |~ "(?i)error" [5m])) > 10
            for: 5m
            labels:
              severity: warning
              component: loki
              alert_type: log-based
            annotations:
              summary: "High error rate detected in logs"
              description: "Namespace {{ $labels.namespace }} is logging more than 10 error lines per second."

          - alert: CriticalErrorsInLogs
            expr: |
              sum by (namespace) (count_over_time({namespace=~".+"} |~ "(?i)(critical|fatal|panic)" [1m])) > 5
            for: 2m
            labels:
              severity: critical
              component: loki
              alert_type: log-based
            annotations:
              summary: "Critical errors detected in logs"
              description: "Namespace {{ $labels.namespace }} logged {{ $value }} critical/fatal/panic lines in the last minute."

      - name: loki-application-alerts
        interval: 1m
        rules:
          - alert: High5xxErrorRate
            expr: |
              sum by (namespace) (rate({namespace=~".+"} |= "status" |~ "status[=:]\\s*5[0-9]{2}" [5m])) > 5
            for: 5m
            labels:
              severity: warning
              component: application
              alert_type: log-based
            annotations:
              summary: "High 5xx error rate in application logs"
              description: "Namespace {{ $labels.namespace }} is logging more than 5 HTTP 5xx lines per second."

      - name: loki-security-alerts
        interval: 1m
        rules:
          - alert: AuthenticationFailures
            expr: |
              sum by (namespace) (count_over_time({namespace=~".+"} |~ "(?i)(authentication failed|unauthorized|forbidden|access denied)" [5m])) > 10
            for: 3m
            labels:
              severity: warning
              component: security
              alert_type: log-based
            annotations:
              summary: "Multiple authentication failures detected"
              description: "Namespace {{ $labels.namespace }} logged {{ $value }} authentication failures in 5 minutes."