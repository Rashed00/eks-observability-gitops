# Thanos objstore config, read by the Prometheus Thanos sidecar.
# This is a plain Secret on purpose: it holds only the bucket name and
# region (no credentials - access comes from the IRSA role), and an
# ExternalSecret with no data/dataFrom is rejected by the External Secrets
# webhook.
apiVersion: v1
kind: Secret
metadata:
  name: thanos-objstore-config
  namespace: observability
type: Opaque
stringData:
  objstore.yml: |
    type: S3
    config:
      bucket: observability-cluster-thanos-777000838881
      endpoint: s3.eu-central-1.amazonaws.com
      region: eu-central-1
      insecure: false
